[workspace]
resolver = "2"
members = [
    "crates/rigor-spec",
    "crates/rigor-kernel",
    "crates/rigor-codec",
    "crates/rigor-runtime",
    "crates/rigor-certificates",
    "crates/rigor-front",
    "crates/rigor-bridges",
    "crates/rigor-bench",
    "crates/rigor-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/GavinY-24/Rigor"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
