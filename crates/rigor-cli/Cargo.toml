[package]
name = "rigor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the Rigor mathematical proof language and verifier"

[[bin]]
name = "rigor"
path = "src/main.rs"

[dependencies]
rigor-spec = { path = "../rigor-spec" }
rigor-kernel = { path = "../rigor-kernel" }
rigor-codec = { path = "../rigor-codec" }
rigor-runtime = { path = "../rigor-runtime" }
rigor-certificates = { path = "../rigor-certificates" }
rigor-front = { path = "../rigor-front" }
rigor-bridges = { path = "../rigor-bridges" }
rigor-bench = { path = "../rigor-bench" }
